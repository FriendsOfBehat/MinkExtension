name: Test

on:
    push:
    pull_request:
        types: [opened, synchronize, edited, reopened]

jobs:
    test:
        name: PHP ${{ matrix.php-version }} ${{ matrix.description }}
        runs-on: ubuntu-latest
        continue-on-error: false
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - '8.1'
                    - '8.2'
                    - '8.3'
                    - '8.4'
                    - '8.5'
                symfony-version: [false]
                description:
                    - '(unmodified composer.json dependencies)'
                include:
                    - php-version: '8.1'
                      symfony-version: '5.4.*'
                      description: 'Symfony 5.4 LTS'
                    - php-version: '8.1'
                      symfony-version: '6.4.*'
                      description: 'Symfony 6.4 LTS'
                    - php-version: '8.2'
                      symfony-version: '7.4.*'
                      description: 'Symfony 7.4 LTS'
                    - php-version: '8.5'
                      minimum-stability: 'dev'
                      description: 'with dev dependencies'
                    - php-version: '8.1'
                      composer-install-flags: '--prefer-lowest --prefer-stable'
                      description: 'with the lowest dependencies'
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  ini-values: "memory_limit=-1"
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2, flex

            - name: Validate composer.json
              run: composer validate --no-check-lock

            - name: Allow dev dependencies
              run: composer config minimum-stability dev
              if: matrix.minimum-stability == 'dev'

            - name: Drop the abandoned Goutte driver
              # Its dependency chain (behat/mink-goutte-driver -> fabpot/goutte -> symfony/browser-kit)
              # is capped well below the newer Symfony versions pinned via SYMFONY_REQUIRE, and
              # it won't be updated since the underlying client library has been abandoned. It's still
              # exercised by the jobs that install the unmodified `composer.json` dependencies.
              run: composer remove --dev --no-update behat/mink-goutte-driver
              if: matrix.symfony-version

            - name: Install dependencies
              run: composer update --prefer-dist --no-progress ${{ matrix.composer-install-flags }}
              env:
                  SYMFONY_REQUIRE: ${{ matrix.symfony-version || '' }}

            - name: PHPSpec
              run: vendor/bin/phpspec run -f pretty

            - name: Behat
              run: vendor/bin/behat -fprogress --strict
