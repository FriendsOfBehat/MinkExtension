name: Test

on:
    push:
    pull_request:
        types: [opened, synchronize, edited, reopened]

jobs:
    test:
        name: PHP ${{ matrix.php-version }} + Symfony ${{ matrix.symfony-version }}
        runs-on: ubuntu-latest
        continue-on-error: false
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - '8.1'
                    - '8.2'
                    - '8.3'
                    - '8.4'
                    - '8.5'
                symfony-version:
                    - 'none'
                include:
                    - php-version: '8.1'
                      symfony-version: '5.4.*'
                      composer-tools: 'composer:v2, flex'
                      composer-command: 'update'
                    - php-version: '8.1'
                      symfony-version: '6.4.*'
                      composer-tools: 'composer:v2, flex'
                      composer-command: 'update'
                    - php-version: '8.2'
                      symfony-version: '7.4.*'
                      composer-tools: 'composer:v2, flex'
                      composer-command: 'update'
                    - php-version: '8.5'
                      symfony-version: 'dev'
                      minimum-stability: 'dev'
                    - php-version: '8.1'
                      symfony-version: 'lowest'
                      composer-command: 'update'
                      composer-install-flags: '--prefer-lowest --prefer-stable'
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  ini-values: "memory_limit=-1"
                  php-version: ${{ matrix.php-version }}
                  tools: ${{ matrix.composer-tools || 'composer:v2' }}

            - name: Validate composer.json
              run: composer validate --no-check-lock

            - name: Allow dev dependencies
              run: composer config minimum-stability dev
              if: matrix.minimum-stability == 'dev'

            - name: Install dependencies
              run: composer ${{ matrix.composer-command || 'install' }} --prefer-dist --no-progress ${{ matrix.composer-install-flags }}
              env:
                  SYMFONY_REQUIRE: ${{ (matrix.symfony-version == '5.4.*' || matrix.symfony-version == '6.4.*' || matrix.symfony-version == '7.4.*') && matrix.symfony-version || '' }}

            - name: Verify the Symfony LTS version was actually applied
              if: matrix.symfony-version == '5.4.*' || matrix.symfony-version == '6.4.*' || matrix.symfony-version == '7.4.*'
              run: |
                  INSTALLED=$(jq -r '.packages[] | select(.name == "symfony/config") | .version' composer.lock)
                  case "${{ matrix.symfony-version }}" in
                      5.4.*) EXPECTED='v5.4' ;;
                      6.4.*) EXPECTED='v6.4' ;;
                      7.4.*) EXPECTED='v7.4' ;;
                  esac
                  if [[ "$INSTALLED" != "$EXPECTED"* ]]; then
                      echo "::error::Expected symfony/config $EXPECTED.*, but Flex resolved $INSTALLED. SYMFONY_REQUIRE may have been silently ignored, see https://github.com/symfony/flex/issues/946"
                      exit 1
                  fi

            - name: PHPSpec
              run: vendor/bin/phpspec run -f pretty

            - name: Behat
              run: vendor/bin/behat -fprogress --strict
